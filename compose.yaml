services:
  postgres:
    image: postgres:17-alpine
    container_name: pasantias-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pasantias_mvp
      POSTGRES_USER: pasantias_user
      POSTGRES_PASSWORD: pasantias_password
    ports:
      - "5437:5432"
    volumes:
      - pasantias_mvp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasantias_user -d pasantias_mvp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pasantias_mvp_data:
